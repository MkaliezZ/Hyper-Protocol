policy_id: hp.course
version: 0.1-draft
status: draft
adoption: proposed
maintainer: null
selection_basis: null
scope:
  subjects:
  - Studio 与 Lab
  tasks:
  - 具体学员产出与学习任务
  conditions:
  - 按当前任务选择并明确适用范围
  exclusions:
  - 未获得的权限、未支持的能力与超出证据范围的结论
goals:
- 具体学员产出与学习任务
priorities:
- 事实与证据门槛优先；其余取舍按本项目已明确目标决定
rules:
- rule_id: course.J01
  kind: hard_gate
  when: 准备形成或交付本领域结论时
  requirement: 围绕明确产物评议任务可完成性、反馈和实际修改。
  rationale: 结论应保持在实际对象与证据支持的范围内。
  evidence_required:
  - 真实任务、支架、作品初稿修订稿与课堂记录
  evaluation_method: mixed
  positive_example: 保留作品与修改对照，再分别观察复做和课堂表现。
  counterexample: 有教案或可运行工作台就宣称课堂学习效果成立。
  missing_behavior: 记录缺项与影响，只交付有依据的部分；不推定已完成未进行的评议。
quality_dimensions:
- dimension_id: course.Q01
  criterion: 具体产出、支架、行动清晰度与可带走成果
preferences:
- 表达、形式与实现参数按项目配置，保留适用理由
decision_authority:
  automated_scope:
  - 当前任务已授权的候选稿、结构检查与记录
  reserved_decisions:
  - 真实课堂验收
  - 学员效果认定
revisions:
- 从 v0.1 产品线映射提炼的起始草案，未逐条获专业审定或部署。
extensions:
  display_name: Studio 与 Lab
