policy_id: hp.governance
version: 0.1-draft
status: draft
adoption: proposed
maintainer: null
selection_basis: null
scope:
  subjects:
  - 项目文件治理
  tasks:
  - 判断规则执行事实与复盘的职责
  conditions:
  - 按当前任务选择并明确适用范围
  exclusions:
  - 未获得的权限、未支持的能力与超出证据范围的结论
goals:
- 判断规则执行事实与复盘的职责
priorities:
- 事实与证据门槛优先；其余取舍按本项目已明确目标决定
rules:
- rule_id: governance.J01
  kind: hard_gate
  when: 准备形成或交付本领域结论时
  requirement: 区分原始事实、上位判断、执行步骤和复盘提案。
  rationale: 结论应保持在实际对象与证据支持的范围内。
  evidence_required:
  - 原材料、权威规则、索引、版本与变更依据
  evaluation_method: mixed
  positive_example: 保留资料来源，另行提交有范围的规则修订。
  counterexample: 将一次反馈或资料摘要自动提升为正式根规则。
  missing_behavior: 记录缺项与影响，只交付有依据的部分；不推定已完成未进行的评议。
quality_dimensions:
- dimension_id: governance.Q01
  criterion: 可定位、可接手、文档适度与恢复依据
preferences:
- 表达、形式与实现参数按项目配置，保留适用理由
decision_authority:
  automated_scope:
  - 当前任务已授权的候选稿、结构检查与记录
  reserved_decisions:
  - 根规则正式生效
  - 公共规则发布
revisions:
- 从 v0.1 产品线映射提炼的起始草案，未逐条获专业审定或部署。
extensions:
  display_name: 项目文件治理
