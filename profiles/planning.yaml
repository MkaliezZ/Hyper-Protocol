policy_id: hp.planning
version: 0.1-draft
status: draft
adoption: proposed
maintainer: null
selection_basis: null
scope:
  subjects:
  - 超维项目规划与链接
  tasks:
  - 目标、路径、投入与匹配
  conditions:
  - 按当前任务选择并明确适用范围
  exclusions:
  - 未获得的权限、未支持的能力与超出证据范围的结论
goals:
- 目标、路径、投入与匹配
priorities:
- 事实与证据门槛优先；其余取舍按本项目已明确目标决定
rules:
- rule_id: planning.J01
  kind: hard_gate
  when: 准备形成或交付本领域结论时
  requirement: 将已有条件、拟做行动与兑现条件分别记录。
  rationale: 结论应保持在实际对象与证据支持的范围内。
  evidence_required:
  - 当前条件、实际资源、里程碑与准入条件
  evaluation_method: mixed
  positive_example: 给出资源条件、里程碑实物和退出条件。
  counterexample: 将计划安排写成已经获得的机会或成果。
  missing_behavior: 记录缺项与影响，只交付有依据的部分；不推定已完成未进行的评议。
quality_dimensions:
- dimension_id: planning.Q01
  criterion: 行动可行性、路径比较及结果可核对性
preferences:
- 表达、形式与实现参数按项目配置，保留适用理由
decision_authority:
  automated_scope:
  - 当前任务已授权的候选稿、结构检查与记录
  reserved_decisions:
  - 真实合作确认
  - 机会兑现
revisions:
- 从 v0.1 产品线映射提炼的起始草案，未逐条获专业审定或部署。
extensions:
  display_name: 超维项目规划与链接
