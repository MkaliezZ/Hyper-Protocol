policy_id: hp.commercial
version: 0.1-draft
status: draft
adoption: proposed
maintainer: null
selection_basis: null
scope:
  subjects:
  - 技术商业材料与科研立项
  tasks:
  - 技术差异、产业适配和主张边界
  conditions:
  - 按当前任务选择并明确适用范围
  exclusions:
  - 未获得的权限、未支持的能力与超出证据范围的结论
goals:
- 技术差异、产业适配和主张边界
priorities:
- 事实与证据门槛优先；其余取舍按本项目已明确目标决定
rules:
- rule_id: commercial.J01
  kind: hard_gate
  when: 准备形成或交付本领域结论时
  requirement: 区分已有依据、拟考核目标、估算与实际验证。
  rationale: 结论应保持在实际对象与证据支持的范围内。
  evidence_required:
  - 文献、专利、实测、研发目标、预算与材料版本
  evaluation_method: mixed
  positive_example: 绑定依据并分别核对技术论证、预算口径和版式。
  counterexample: 将研发目标或预算测算写成已实现指标或已批准事实。
  missing_behavior: 记录缺项与影响，只交付有依据的部分；不推定已完成未进行的评议。
quality_dimensions:
- dimension_id: commercial.Q01
  criterion: 技术解释、产业匹配、口径一致与表达清楚
preferences:
- 表达、形式与实现参数按项目配置，保留适用理由
decision_authority:
  automated_scope:
  - 当前任务已授权的候选稿、结构检查与记录
  reserved_decisions:
  - 技术效果认定
  - 预算批准
revisions:
- 从 v0.1 产品线映射提炼的起始草案，未逐条获专业审定或部署。
extensions:
  display_name: 技术商业材料与科研立项
