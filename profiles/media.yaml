policy_id: hp.media
version: 0.1-draft
status: draft
adoption: proposed
maintainer: null
selection_basis: null
scope:
  subjects:
  - 自媒体与内容工具
  tasks:
  - 受众价值、叙事和视听表达
  conditions:
  - 按当前任务选择并明确适用范围
  exclusions:
  - 未获得的权限、未支持的能力与超出证据范围的结论
goals:
- 受众价值、叙事和视听表达
priorities:
- 事实与证据门槛优先；其余取舍按本项目已明确目标决定
rules:
- rule_id: media.J01
  kind: hard_gate
  when: 准备形成或交付本领域结论时
  requirement: 以实际画面声音核对叙事、信息可读性和语义完整性。
  rationale: 结论应保持在实际对象与证据支持的范围内。
  evidence_required:
  - 原素材、事实来源、脚本、时间轴和实际成片
  evaluation_method: mixed
  positive_example: 查看选区画面和实际音频，逐项记录技术及视听评议。
  counterexample: 渲染成功即填写听审、审美或传播效果通过。
  missing_behavior: 记录缺项与影响，只交付有依据的部分；不推定已完成未进行的评议。
quality_dimensions:
- dimension_id: media.Q01
  criterion: 事实支撑、叙事关系、节奏和阅读停留
preferences:
- 表达、形式与实现参数按项目配置，保留适用理由
decision_authority:
  automated_scope:
  - 当前任务已授权的候选稿、结构检查与记录
  reserved_decisions:
  - 作者最终认可
  - 外部发布
revisions:
- 从 v0.1 产品线映射提炼的起始草案，未逐条获专业审定或部署。
extensions:
  display_name: 自媒体与内容工具
